{{- $clusterInfoExporterEnabled := include "clusterInfoExporter.isEnabled" . | fromYaml }}
{{- if $clusterInfoExporterEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clusterInfoExporter.fullname" . }}-role
  labels:
    {{- include "clusterInfoExporter.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
{{- end }}
