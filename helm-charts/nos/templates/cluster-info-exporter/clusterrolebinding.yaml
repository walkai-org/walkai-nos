{{- $clusterInfoExporterEnabled := include "clusterInfoExporter.isEnabled" . | fromYaml }}
{{- if $clusterInfoExporterEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clusterInfoExporter.fullname" . }}-rolebinding
  labels:
    {{- include "clusterInfoExporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clusterInfoExporter.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "clusterInfoExporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
