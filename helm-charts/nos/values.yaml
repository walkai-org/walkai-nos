# Default values for nos.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# -- Defines how many GB of memory each nvidia.com/gpu resource has.
nvidiaGpuResourceMemoryGB: 32

# -- If true allows to deploy `nos` chart in the `default` namespace
allowDefaultNamespace: false

# -- If true, shares with Nebuly telemetry data collected only during the Chart installation
shareTelemetry: true
gpuPartitioner:
  # -- Enable or disable the `nos gpu partitioner`
  enabled: true

  # -- The level of log of the GPU Partitioner.
  # Zero corresponds to `info`, while values greater or equal than 1 corresponds to higher debug levels.
  # **Must be >= 0**.
  logLevel: 0

  # -- Number of replicas of the gpu-manager Pod.
  replicaCount: 1

  nameOverride: ""
  fullnameOverride: ""

  devicePlugin:
    config:
      # -- Name of the ConfigMap containing the NVIDIA Device Plugin configuration files.
      # It must be equal to the value "devicePlugin.config.name" of the Helm chart used for deploying the
      # NVIDIA GPU Operator.
      name: nos-device-plugin-configs
      # -- Namespace of the ConfigMap containing the NVIDIA Device Plugin configuration files. It must be equal to
      # the namespace where the Nebuly NVIDIA Device Plugin has been deployed to.
      namespace: nebuly-nvidia
    # -- Duration of the delay between when the new partitioning config is computed and when it is sent to
    # the NVIDIA device plugin. Since the config is provided to the plugin as a mounted ConfigMap, this delay is required
    # to ensure that the updated ConfigMap is propagated to the mounted volume.
    configUpdateDelaySeconds: 5

  scheduler:
    config:
      # -- Name of the ConfigMap containing the k8s scheduler configuration file. If not specified or the
      # ConfigMap does not exist, the GPU partitioner will use the default k8s scheduler profile.
      name: nos-scheduler-config

  image:
    # -- Sets the GPU Partitioner Docker image.
    repository: ghcr.io/walkai-org/nos-gpu-partitioner
    # -- Sets the GPU Partitioner Docker image pull policy.
    pullPolicy: IfNotPresent
    # -- Overrides the GPU Partitioner image tag whose default is the chart appVersion.
    tag: ""

  # -- Configuration of the MIG Agent component of the GPU Partitioner.
  # @default -- -
  migAgent:
    # -- Interval at which the mig-agent will report to k8s the MIG partitioning status of the GPUs of the Node
    reportConfigIntervalSeconds: 10
    # -- The level of log of the MIG Agent.
    # Zero corresponds to `info`, while values greater or equal than 1 corresponds to higher debug levels.
    # **Must be >= 0**.
    logLevel: 0
    image:
      # -- Sets the MIG Agent Docker image.
      repository: ghcr.io/walkai-org/nos-mig-agent
      # -- Sets the MIG Agent Docker image pull policy.
      pullPolicy: IfNotPresent
      # -- Overrides the MIG Agent image tag whose default is the chart appVersion.
      tag: ""
    # -- Sets the resource requests and limits of the MIG Agent container.
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
    # -- Sets the tolerations of the MIG Agent Pod.
    tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

  # -- Configuration of the [Kube RBAC Proxy](https://github.com/brancz/kube-rbac-proxy), which runs as sidecar of
  # all the GPU Partitioner components Pods.
  # @default -- -
  kubeRbacProxy:
    logLevel: 1
    image:
      repository: gcr.io/kubebuilder/kube-rbac-proxy
      pullPolicy: IfNotPresent
      tag: "v0.13.0"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 5m
        memory: 64Mi


  # -- Interval at which the GPU partitioner reconciler wakes up even without new Pod events.
  requeueIntervalSeconds: 10

  leaderElection:
    # -- Enables/Disables the leader election of the GPU Partitioner controller manager.
    enabled: true

  # -- Sets the security context of the GPU partitioner Pod.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000

  # -- Sets the resource limits and requests of the GPU partitioner container.
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Sets the annotations of the GPU Partitioner Pod.
  podAnnotations: { }

  # -- Sets the tolerations of the GPU Partitioner Pod.
  tolerations: [ ]

  # -- Sets the affinity config of the GPU Partitioner Pod.
  affinity: { }

  # -- Sets the nodeSelector config of the GPU Partitioner Pod.
  nodeSelector: { }

  # -- List that associates GPU models to the respective allowed MIG configurations
  # @default -- -
  knownMigGeometries:
    - models: [ "A30" ]
      allowedGeometries:
        - 1g.6gb: 4
        - 1g.6gb: 2
          2g.12gb: 1
        - 2g.12gb: 2
        - 4g.24gb: 1
    - models: [ "A100-SXM4-40GB", "NVIDIA-A100-40GB-PCIe", "NVIDIA-A100-SXM4-40GB" ]
      allowedGeometries:
        - 1g.5gb: 7
        - 1g.5gb: 5
          2g.10gb: 1
        - 1g.5gb: 3
          2g.10gb: 2
        - 1g.5gb: 1
          2g.10gb: 3
        - 1g.5gb: 2
          2g.10gb: 1
          3g.20gb: 1
        - 2g.10gb: 2
          3g.20gb: 1
        - 1g.5gb: 3
          3g.20gb: 1
        - 1g.5gb: 1
          2g.10gb: 1
          3g.20gb: 1
        - 3g.20gb: 2
        - 1g.5gb: 3
          4g.20gb: 1
        - 1g.5gb: 1
          2g.10gb: 1
          4g.20gb: 1
        - 7g.40gb: 1
    - models: [ "NVIDIA-A100-SXM4-80GB", "NVIDIA-A100-80GB-PCIe" ]
      allowedGeometries:
        - 1g.10gb: 7
        - 1g.10gb: 5
          2g.20gb: 1
        - 1g.10gb: 3
          2g.20gb: 2
        - 1g.10gb: 1
          2g.20gb: 3
        - 1g.10gb: 2
          2g.20gb: 1
          3g.40gb: 1
        - 2g.20gb: 2
          3g.20gb: 1
        - 1g.10gb: 3
          3g.40gb: 1
        - 1g.10gb: 1
          2g.20gb: 1
          3g.40gb: 1
        - 3g.40gb: 2
        - 1g.10gb: 3
          4g.40gb: 1
        - 1g.10gb: 1
          2g.20gb: 1
          4g.40gb: 1
        - 7g.79gb: 1


clusterInfoExporter:
  # -- Enable or disable the Cluster Info Exporter DaemonSet
  enabled: false

  # -- Overrides the name of the Cluster Info Exporter resources.
  nameOverride: ""
  # -- Overrides the fully qualified name of the Cluster Info Exporter resources.
  fullnameOverride: ""

  image:
    # -- Repository of the Cluster Info Exporter image.
    repository: ghcr.io/walkai-org/nos-cluster-info-exporter
    # -- Image pull policy of the Cluster Info Exporter container.
    pullPolicy: IfNotPresent
    # -- Overrides the Cluster Info Exporter image tag whose default is the chart appVersion.
    tag: ""

  config:
    # -- API endpoint that receives cluster information payloads (required when enabling the exporter)
    endpoint: ""
    # -- Interval between reports (e.g. 10s, 5m)
    interval: 3s
    # -- HTTP timeout for report requests
    httpTimeout: 10s

  # -- Configuration of the ServiceAccount used by the Cluster Info Exporter.
  # @default -- -
  serviceAccount:
    # -- Whether to create the ServiceAccount.
    create: true
    # -- Extra annotations added to the ServiceAccount.
    annotations: { }
    # -- Overrides the ServiceAccount name.
    name: ""

  # -- Configuration of the Secret that stores the API token consumed by the exporter.
  # @default -- -
  secret:
    # -- When true the chart will create the Secret that stores the API token
    create: false
    # -- Name of the Secret that stores the API token (created or pre-existing)
    name: cluster-info-exporter-secrets
    # -- Use an already existing Secret instead of creating a new one (takes precedence over `name`)
    existingSecret: ""
    # -- Key that stores the token inside the Secret
    key: apiToken
    # -- Value used when creating the Secret (ignored otherwise)
    apiToken: ""

  # -- Annotations added to the Cluster Info Exporter Pods.
  podAnnotations: { }
  # -- Node selector for the Cluster Info Exporter Pods.
  nodeSelector: { }
  # -- Affinity rules for the Cluster Info Exporter Pods.
  affinity: { }

  # -- Pod security context for the Cluster Info Exporter Pods.
  podSecurityContext:
    runAsNonRoot: true

  # -- Container security context for the Cluster Info Exporter container.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  # -- Resource requests and limits for the Cluster Info Exporter container.
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # -- Tolerations applied to the Cluster Info Exporter Pods.
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  # -- Configuration of the API client namespace, ServiceAccount, RBAC settings and token Secret.
  # @default -- -
  apiClient:
    # -- Enable or disable provisioning of the API client resources.
    enabled: true
    # -- Namespace where the API client ServiceAccount and token Secret live.
    namespace: walkai
    # -- Whether the chart should create the namespace defined above.
    createNamespace: true
    # -- Name of the API client ServiceAccount.
    serviceAccountName: api-client
    # -- Name of the long-lived ServiceAccount token Secret for the API client.
    tokenSecretName: api-client-permanent-token
    # -- Name of the discovery ClusterRole granted to the API client.
    discoveryClusterRoleName: discovery-minimal
    # -- Name of the ClusterRoleBinding that assigns the discovery ClusterRole.
    discoveryClusterRoleBindingName: discovery-minimal-for-walkai-api-client
    # -- Name of the RoleBinding that grants the admin ClusterRole inside the API client namespace.
    adminRoleBindingName: walkai-api-client-admin
    # -- ClusterRole granted by the admin RoleBinding.
    adminClusterRoleName: admin
